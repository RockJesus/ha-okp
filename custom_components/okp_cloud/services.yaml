# Descriptions for the okp_cloud services (shown in the developer tools UI
# and in the automation editor).
refresh_session:
  name: 手动续期云会话
  description: >-
    默认只**读取并返回**当前会话状态，不做任何网络请求，不会消耗令牌。
    CoolKit 云端在续期时会轮换刷新令牌（rt）并作废旧令牌，因此「只是看一眼」
    绝不能顺手续期——排查时请保持 force 关闭。
    只有确实需要立刻换一个新令牌时才把 force 打开。
  fields:
    force:
      name: 立即续期
      description: >-
        打开后会真的调用云端续期接口（优先用 rt，rt 被拒绝才回退登录令牌）。
        会消耗并轮换当前刷新令牌，非必要不要打开。
      required: false
      default: false
      selector:
        boolean:

set_timer:
  name: 启用/停用定时任务
  description: >-
    启用或停用设备上的一条定时清扫任务。云端没有单独的定时任务接口，App 的做法是把
    整组 timers 重写一遍；本服务会先重新读取当前任务列表，只改目标任务的 enabled，
    写入后再回读校验，不会覆盖你在 App 里新加或删除的任务。
    任务的 mId 见「启用的定时任务」传感器 timers 属性。
  fields:
    mid:
      name: 任务 ID
      description: 定时任务的 mId（定时任务传感器 timers 属性里的 mId 字段）。
      required: true
      example: "15ac9f57-5bb1-4b74-a417-bc8b57983d82"
      selector:
        text:
    enabled:
      name: 启用
      description: 打开或关闭该任务。
      required: true
      default: true
      selector:
        boolean:
    device_id:
      name: 设备
      description: 有多台机器人时才需要指定，值为 CoolKit 设备 ID（实体 ID 中间那一段）。
      required: false
      example: "100258a68a"
      selector:
        text:

move:
  name: 手动遥控
  description: >-
    像手机 App 的摇杆一样驱动机器人。App 的做法是「按住时写 move=方向，松手写 move=4」，
    本服务默认替你把「松手」也做掉（duration 秒后自动松开），所以一次调用就是一次短促移动。
    想实现真正的摇杆（按住走、松手停），把 duration 设为 0，之后调用 direction: stop 松开；
    万一调用方没能松开（卡片关了、脚本中断），集成会在 10 秒后自动松开，不会让机器一直往前跑。
    方向值 0/1/2/3 与前后左右的对应关系来自厂商约定、尚未在真机上核对；如果某个方向不对，
    可以直接用 value 传原始 dp 值试（0-3 方向，4 松开）。
  fields:
    direction:
      name: 方向
      description: forward 前进 / backward 后退 / left 左转 / right 右转 / stop 松开（停止移动）。
      required: false
      example: forward
      selector:
        select:
          options:
            - forward
            - backward
            - left
            - right
            - stop
    value:
      name: 原始 dp 值
      description: 直接用 move dp 的数值（0-3 方向、4 松开），与 direction 二选一。用于核对方向映射。
      required: false
      selector:
        number:
          min: 0
          max: 4
          step: 1
          mode: box
    duration:
      name: 按压时长
      description: 自动松开的秒数；0 表示一直按住直到 direction=stop。上限 10 秒，缺省 0.4 秒。
      required: false
      default: 0.4
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: s
    device_id:
      name: 设备
      description: 有多台机器人时才需要指定，值为 CoolKit 设备 ID（实体 ID 中间那一段）。
      required: false
      example: "100258a68a"
      selector:
        text:
